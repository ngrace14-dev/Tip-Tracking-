        </div>

        <div v-if="showEmployeeModal" class="fixed inset-0 bg-black/60 flex items-center justify-center z-[60] backdrop-blur-sm" @click.self="showEmployeeModal = false">
            <div class="bg-white rounded-2xl shadow-2xl w-[820px] max-h-[85vh] flex flex-col overflow-hidden">
                <div class="px-6 py-4 border-b flex justify-between items-center bg-gray-50 shrink-0">
                    <h2 class="font-bold text-xl text-gray-800 flex items-center gap-2">
                        <i data-lucide="users" class="w-5 h-5 text-[#217346]"></i> Manage Roster ({{ activeSite }})
                    </h2>
                    <button @click="showEmployeeModal = false" class="text-gray-500 hover:text-red-600 transition-colors p-1.5 bg-gray-200 hover:bg-red-100 rounded-md">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                
                <div class="p-6 flex flex-col gap-5 overflow-hidden flex-1 bg-white">
                    <!-- Add Employee Form -->
                    <div class="bg-green-50/50 border border-green-200 p-4 rounded-xl shadow-sm flex flex-col gap-3 shrink-0">
                        <h3 class="text-xs font-bold uppercase tracking-wide text-[#217346]">Add New Employee</h3>
                        <div class="flex gap-3 items-end">
                            <div class="flex-1">
                                <label class="text-[11px] text-gray-600 font-bold uppercase tracking-wide mb-1 block">Last Name</label>
                                <input type="text" v-model="newEmp.last" class="border border-gray-300 p-2 w-full bg-white rounded-lg focus:ring-2 outline-none text-sm" placeholder="e.g. Smith">
                            </div>
                            <div class="flex-1">
                                <label class="text-[11px] text-gray-600 font-bold uppercase tracking-wide mb-1 block">First Name</label>
                                <input type="text" v-model="newEmp.first" class="border border-gray-300 p-2 w-full bg-white rounded-lg focus:ring-2 outline-none text-sm" placeholder="e.g. John">
                            </div>
                            <div class="w-28">
                                <label class="text-[11px] text-gray-600 font-bold uppercase tracking-wide mb-1 block">Emp #</label>
                                <input type="text" v-model="newEmp.tempId" class="border border-gray-300 p-2 w-full bg-white rounded-lg focus:ring-2 outline-none text-sm font-mono text-center" placeholder="1234">
                            </div>
                        </div>
                        <div class="flex justify-between items-center mt-1 pt-2 border-t border-green-200/60">
                            <div class="flex gap-6 items-center">
                                <div class="flex gap-3 items-center">
                                    <span class="text-xs font-bold text-gray-600">Roles:</span>
                                    <label class="flex items-center gap-1.5 cursor-pointer text-xs font-bold text-gray-700">
                                        <input type="checkbox" v-model="newEmp.isDriver" class="w-4 h-4 accent-green-600"> Driver
                                    </label>
                                    <label class="flex items-center gap-1.5 cursor-pointer text-xs font-bold text-gray-700">
                                        <input type="checkbox" v-model="newEmp.isManager" class="w-4 h-4 accent-blue-600"> Manager
                                    </label>
                                </div>
                                <div class="w-px h-4 bg-gray-300"></div>
                                <div class="flex gap-3 items-center">
                                    <span class="text-xs font-bold text-gray-600">Assigned Stores:</span>
                                    <label class="flex items-center gap-1.5 cursor-pointer text-xs font-bold text-gray-700">
                                        <input type="checkbox" v-model="newEmp.siteRB" class="w-4 h-4 accent-green-600"> Red Bluff
                                    </label>
                                    <label class="flex items-center gap-1.5 cursor-pointer text-xs font-bold text-gray-700">
                                        <input type="checkbox" v-model="newEmp.siteRD" class="w-4 h-4 accent-blue-600"> Redding
                                    </label>
                                </div>
                            </div>
                            <button @click="addEmployee" class="bg-[#217346] hover:bg-[#185c37] text-white px-5 py-2 rounded-lg font-bold shadow-sm transition-colors text-xs flex items-center gap-1">
                                <i data-lucide="user-plus" class="w-4 h-4"></i> Add
                            </button>
                        </div>
                    </div>

                    <!-- Roster Table with Store Location Checkboxes -->
                    <div class="border rounded-xl shadow-sm flex-1 flex flex-col min-h-0 overflow-hidden">
                        <div class="overflow-y-auto flex-1">
                            <table class="w-full text-sm relative">
                                <thead class="bg-gray-100 sticky top-0 z-10 shadow-sm">
                                    <tr>
                                        <th class="text-left py-2.5 px-4 font-bold text-gray-700 bg-gray-100">Employee Name</th>
                                        <th class="text-center py-2.5 px-3 font-bold text-gray-700 bg-gray-100">Emp ID</th>
                                        <th class="text-center py-2.5 px-4 font-bold text-gray-700 bg-gray-100">Assigned Store Locations</th>
                                        <th class="text-center py-2.5 px-3 font-bold text-gray-700 bg-gray-100">Role</th>
                                        <th class="text-right py-2.5 px-4 font-bold text-gray-700 bg-gray-100">Action</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100 bg-white">
                                    <tr v-for="emp in employees" :key="'m-emp-'+emp.id" class="hover:bg-gray-50 transition-colors">
                                        <td class="py-2 px-4 font-bold text-gray-800">
                                            {{ emp.lastName }}, {{ emp.firstName }}
                                        </td>
                                        <td class="py-2 px-3 text-center font-mono font-bold text-gray-700">
                                            {{ emp.tempId || '-' }}
                                        </td>
                                        <td class="py-2 px-4 text-center">
                                            <div class="flex justify-center items-center gap-3">
                                                <label class="flex items-center gap-1 cursor-pointer px-2.5 py-1 rounded border transition-colors"
                                                       :class="emp.sites && emp.sites.includes('Red Bluff') ? 'bg-green-100 border-green-300 text-green-800 font-bold' : 'bg-gray-50 border-gray-200 text-gray-400'">
                                                    <input type="checkbox" :checked="emp.sites && emp.sites.includes('Red Bluff')" @change="toggleEmployeeSite(emp, 'Red Bluff')" class="w-3.5 h-3.5 accent-green-600">
                                                    <span class="text-xs">Red Bluff</span>
                                                </label>
                                                <label class="flex items-center gap-1 cursor-pointer px-2.5 py-1 rounded border transition-colors"
                                                       :class="emp.sites && emp.sites.includes('Redding') ? 'bg-blue-100 border-blue-300 text-blue-800 font-bold' : 'bg-gray-50 border-gray-200 text-gray-400'">
                                                    <input type="checkbox" :checked="emp.sites && emp.sites.includes('Redding')" @change="toggleEmployeeSite(emp, 'Redding')" class="w-3.5 h-3.5 accent-blue-600">
                                                    <span class="text-xs">Redding</span>
                                                </label>
                                            </div>
                                        </td>
                                        <td class="py-2 px-3 text-center">
                                            <div class="flex justify-center gap-2">
                                                <label class="flex items-center gap-1 cursor-pointer text-xs font-semibold text-gray-700">
                                                    <input type="checkbox" v-model="emp.isDriver" class="w-3.5 h-3.5 accent-green-600"> Driver
                                                </label>
                                                <label class="flex items-center gap-1 cursor-pointer text-xs font-semibold text-gray-700">
                                                    <input type="checkbox" v-model="emp.isManager" class="w-3.5 h-3.5 accent-blue-600"> Manager
                                                </label>
                                            </div>
                                        </td>
                                        <td class="py-2 px-4 text-right">
                                            <button @click="removeEmployee(emp.id)" class="text-red-500 hover:text-white hover:bg-red-500 font-medium px-2 py-1 rounded transition-colors text-xs">
                                                Remove
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div v-if="modal.isOpen" class="fixed inset-0 bg-black/60 flex items-center justify-center z-[300] backdrop-blur-sm">
